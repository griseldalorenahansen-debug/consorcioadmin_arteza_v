        const PdfCanvasViewer = ({ base64Data }) => {
            const [pdf, setPdf] = useState(null);
            const [pages, setPages] = useState(0);
            const containerRef = useRef(null);

            useEffect(() => {
                if (!base64Data) return;
                const initPdf = async () => {
                    try {
                        const base64 = base64Data.includes(',') ? base64Data.split(',')[1] : base64Data;
                        const binaryString = atob(base64);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        const loadingTask = window.pdfjsLib.getDocument({ data: bytes });
                        const loadedPdf = await loadingTask.promise;
                        setPdf(loadedPdf);
                        setPages(loadedPdf.numPages);
                    } catch (error) {
                        console.error("Error al renderizar PDF:", error);
                    }
                };
                initPdf();
            }, [base64Data]);

            useEffect(() => {
                if (!pdf || !containerRef.current) return;
                const renderPages = async () => {
                    containerRef.current.innerHTML = ''; 
                    for (let i = 1; i <= pages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        canvas.className = 'mb-6 shadow-2xl mx-auto max-w-full rounded-lg bg-white border border-slate-300';
                        containerRef.current.appendChild(canvas);
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                    }
                };
                renderPages();
            }, [pdf, pages]);

                <div className="flex flex-col items-center justify-center h-full text-slate-400">
                    <i className="fa-solid fa-spinner fa-spin text-5xl mb-4 text-indigo-500"></i>

                    }
                    const blob = new Blob([bytes], { type: 'application/pdf' });

                                    <div className="flex gap-2 justify-end pt-3 border-t dark:border-slate-700">
                                        <button type="button" onClick={() => setIsLibreDeudaModalOpen(false)} className="px-4 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition hover:bg-slate-200 dark:hover:bg-slate-600">Cancelar</button>
                                        <button type="submit" className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition">Guardar Certificado</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {selectedCertModal && (
                        <div className="fixed inset-0 z-[70] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-300">
                                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2"><i className="fa-solid fa-file-pdf text-rose-600"></i> Vista Previa - Libre de Deuda</h3>
                                    <button onClick={() => setSelectedCertModal(null)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-8 bg-white" id={`pdf-render-${selectedCertModal.id}`}>
                                    <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-start">
                                        <div>
                                            <h2 className="font-black text-lg text-slate-900 uppercase">Consorcio ARTEZA V</h2>
                                            <p className="text-xs text-slate-600 font-medium">Administración de Copropiedades</p>
                                        </div>
                                        <div className="text-right text-xs text-slate-600">
                                            <p className="font-bold text-slate-800">Certificado N° {selectedCertModal.id}</p>
                                            <p>Fecha de emisión: {selectedCertModal.issueDate}</p>
                                        </div>
                                    </div>

                                    <h1 className="text-center font-bold text-base uppercase text-slate-900 underline underline-offset-4 mb-6">CERTIFICADO DE LIBRE DEUDA DE EXPENSAS</h1>

                                    <div className="space-y-4 text-sm text-slate-800 leading-relaxed text-justify">
                                        <p>Por la presente, la Administración del Consorcio de Propietarios del Edificio <strong>ARTEZA V</strong>, certifica que la Unidad Funcional designada como <strong>Departamento {selectedCertModal.unit}</strong>, cuyo titular registrado es <strong>{selectedCertModal.owner}</strong> {selectedCertModal.dni ? `(DNI/CUIT: ${selectedCertModal.dni})` : ''}:</p>
                                        
                                        <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg text-center my-4">
                                            <p className="font-bold text-slate-900 uppercase">No registra deudas en concepto de expensas comunes, ordinarias ni extraordinarias.</p>
                                            <p className="text-xs mt-1">Saldado hasta el período: <strong>{selectedCertModal.periodUntil}</strong> (inclusive).</p>
                                        </div>

                                        {selectedCertModal.bodyText && (
                                            <p className="whitespace-pre-line">{selectedCertModal.bodyText}</p>
                                        )}

                                        <p>Se expide el presente certificado a solicitud del interesado para ser presentado ante <strong>{selectedCertModal.purpose}</strong>.</p>
                                    </div>

                                    <div className="mt-16 pt-8 border-t border-slate-300 grid grid-cols-2 gap-8 text-center text-xs text-slate-600">
                                        <div>
                                            <p className="font-bold text-slate-800 uppercase">{selectedCertModal.owner}</p>
                                            <p>Titular Unidad {selectedCertModal.unit}</p>
                                        </div>
                                        <div>
                                            <p className="font-bold text-slate-800 uppercase">{selectedCertModal.adminName}</p>
                                            <p>Administrador Consorcio ARTEZA V</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                                    <button onClick={() => setSelectedCertModal(null)} className="px-4 py-2 text-slate-600 font-bold text-sm hover:text-slate-900 transition">Cerrar Visor</button>
                                    <button onClick={() => handleDownloadPDF(selectedCertModal)} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow-lg transition flex items-center gap-2">
                                        <i className="fa-solid fa-download"></i> Descargar PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl border dark:border-slate-700 text-center animate-[fadeIn_0.2s_ease-out]">
                                <div className="w-16 h-16 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-500 mx-auto flex items-center justify-center text-3xl mb-4">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="font-bold text-lg dark:text-white mb-2">Confirmar Acción</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300 mb-6">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={closeConfirm} className="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white rounded-xl text-sm font-bold transition hover:bg-slate-300 dark:hover:bg-slate-600">Cancelar</button>
                                    <button onClick={() => { if(confirmDialog.onConfirm) confirmDialog.onConfirm(); closeConfirm(); }} className="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-bold shadow-md transition">Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
